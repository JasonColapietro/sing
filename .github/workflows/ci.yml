name: CI

# vercel.json's ignoreCommand kills every non-production build, so no preview
# deploy ever runs for a PR: this workflow is the only pre-merge proof that the
# app compiles. "Vercel deployed" is a production signal, never a PR signal.
on:
  pull_request:
  # The static checks and build on main too, so the commit Vercel deploys was
  # checked as merged, not only as a PR branch that main may have moved under.
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest push to a PR branch (or to main) matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build once, then exercise that exact production output in isolated browser
  # jobs. The final `ci` gate below keeps the existing required-check name.
  checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # .nvmrc and package.json `engines` track the Vercel production
          # runtime (24.x); if prod moves, move them.
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # First because it fails in seconds rather than the minute a build takes.
      # `next build` only type-checks what the app graph reaches; the tests,
      # next-config.test.ts, proxy.test.ts and vitest.config.mts are only seen
      # here.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The DSP (pitch, breath, vibrato), the mic hooks against a fake stream,
      # the SEO page renders and the generated-data staleness checks. What
      # needs a real browser and audio path is the browser matrix below.
      - name: Test
        run: npm test

      # Every env var is read lazily inside a function, so a missing key is a
      # request-time error rather than a build failure; that is what lets CI
      # build with no secrets. A module-scope env read would start failing
      # here.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Save production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .next/
            !.next/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  browser:
    name: Browser (${{ matrix.suite }})
    # Pull requests only: a push to main has already had its browser run.
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      # One failed suite must not cancel the independent evidence from others.
      fail-fast: false
      matrix:
        # The suites are defined in e2e/suite.mjs; e2e/suite.test.mjs keeps
        # this list equal to them.
        suite: [journeys, mobile-audit, desktop-audit, audio, layout-shift, layout-shift-finished]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SING_BASE_URL: http://127.0.0.1:3100
      # All fixtures live in fresh browser contexts against a local server.
      # Never attach an account, payment, comp-code, or production data store.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_SECRET_KEY: ''
      STRIPE_SECRET_KEY: ''
      PRO_KEY_SECRET: ''
      PRO_COMP_CODES: ''
      UPSTASH_REDIS_REST_URL: ''
      UPSTASH_REDIS_REST_TOKEN: ''
      KV_REST_API_URL: ''
      KV_REST_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # upload-artifact stores the contents of .next at the artifact root.
      - name: Restore production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next

      # The ~150 MB Chromium download is cached per Playwright version; the
      # cold install swung between 17 s and 582 s per job on the CDN alone.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install full Chromium
        shell: bash
        env:
          CACHE_HIT: ${{ steps.chromium-cache.outputs.cache-hit }}
        run: |
          mkdir -p browser-results
          # The apt dependencies are not cached and are quick.
          npx playwright install-deps chromium 2>&1 | tee browser-results/browser-install.log
          if [ "$CACHE_HIT" != 'true' ]; then
            npx playwright install --no-shell chromium 2>&1 | tee -a browser-results/browser-install.log
          fi
          browser_path="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$browser_path"
          echo "SING_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"

      # e2e/suite.mjs waits for the server, runs every command of the suite
      # (keeping going after a failure so each one's evidence is captured),
      # writes the step summary and annotations, and exits non-zero if any
      # failed. Run the same thing locally with `node e2e/suite.mjs <suite>`.
      - name: Run browser suite
        shell: bash
        env:
          SING_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p browser-results
          npm start -- --hostname 127.0.0.1 --port 3100 > browser-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node e2e/suite.mjs "$SING_SUITE"

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.suite }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 7

  # No path filters, and always report even when an upstream job failed,
  # skipped, or was cancelled. Branch protection can keep requiring `ci`.
  ci:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require static and browser checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHECKS_RESULT" = success
          # The browser matrix is skipped on a push to main, never on a PR.
          case "$BROWSER_RESULT" in
            success) ;;
            skipped) test "$EVENT" = push ;;
            *) exit 1 ;;
          esac
